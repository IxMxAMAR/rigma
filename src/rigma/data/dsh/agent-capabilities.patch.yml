# Capabilities Rigma adds to the DeepSeek Harness's minimal profile.
#
# WHY THIS FILE EXISTS. Rigma boots DSH with `profile="sdk-minimal"`. That
# profile is NOT a trimmed `dsh-base` — it is a complete standalone Cordis tree
# (packages/bundle/sdk-minimal/cordis.patch.yml, and its README says so) whose
# only model-facing tools are the two persistent shells. Goals, subagents,
# todos, skills, plan mode, workflows and every filesystem tool were never
# mounted, so no amount of event forwarding could show them: the capabilities
# did not exist in the runtime.
#
# WHY A PATCH AND NOT A PROFILE CHANGE. `profile="sdk"` would add all of this,
# and would also change ~25 unrelated behaviours: the sandbox drops from
# `danger-full-access` to `workspace-write`, an approval gate is mounted that
# has no answerer on the SDK stdio transport and therefore FAILS CLOSED,
# session logs switch to zstd, `$DSH_HOME/settings.yaml` and the credential
# store become live inputs, and the system prompt gains harness identity and
# runtime context. This file adds capabilities without touching any of that.
#
# HOW IT COMPOSES. `applyEntryPatches` (vendor/include/src/index.ts) pushes an
# `insert` list straight onto the profile's entry list with no precondition on
# id or name, and Rigma's `patches=(...)` is applied in `context.overlays` —
# ABOVE every bundle layer. So a pure-insert patch composes on top of the
# standalone minimal tree. Every package named here is a direct dependency of
# the packaged runtime closure (python/sdk-runtime/package.json), so nothing
# needs installing and pnpm is never involved.
#
# READ THIS BEFORE EDITING. A patch row that names an id which does not exist
# is SKIPPED WITH A WARNING, NOT FATALLY — so a typo here silently yields a
# missing tool rather than a failed boot. And `config:` REPLACES a row's whole
# config object; it does not merge. Verify any change with:
#
#   dsh --profile sdk-minimal --patch <this file> --dump-config
#
# and confirm the rows appear. tests/test_dsh_capabilities.py pins the rows
# this file is expected to carry, for the same reason.

- insert:
    # ---- filesystem: provider, then the tools that need it ------------------
    # `dsh-tool-fs` and `dsh-tool-fs-search` inject `fs`, which nothing in the
    # minimal tree provides. Without the provider row the tools mount and then
    # never activate, which looks identical to not having added them.
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'

    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'

    - id: tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        # Required by the plugin's own schema; there is no default, so omitting
        # it is fatal at mount rather than a silent degradation.
        sampleOverCapGlobResults: false

    - id: tool-str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'

    # ---- workspace instructions (AGENTS.md / CLAUDE.md) --------------------
    # The minimal profile discovers none, so a workspace's own instructions are
    # invisible to the agent. 64 KiB matches dsh-base.
    - id: agent-instructions
      name: '@deepseek-ai/dsh-agent-instructions'
      config:
        maxBytes: 65536

    # ---- todos: pure session state, no service behind it -------------------
    - id: tool-todo
      name: '@deepseek-ai/dsh-tool-todo'
      config:
        allowParallelInProgress: true

    # ---- goals: registry, round driver, then the tool ----------------------
    # The driver is what continues a goal across rounds, so `tool-goal` without
    # it would let a model set a goal that nothing ever advances.
    - id: goal
      name: '@deepseek-ai/dsh-goal'

    - id: goal-round-driver
      name: '@deepseek-ai/dsh-goal-round-driver'

    - id: tool-goal
      name: '@deepseek-ai/dsh-tool-goal'

    # ---- skills ------------------------------------------------------------
    - id: skill
      name: '@deepseek-ai/dsh-skill'

    - id: skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'

    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'

    # ---- subagents ---------------------------------------------------------
    # Two providers behind one package: `spawn` starts a fresh child, `fork`
    # continues from the parent's context. Both tools are the same plugin under
    # different toolName configs, which is how dsh-base does it.
    - id: subagent
      name: '@deepseek-ai/dsh-subagent'

    - id: subagent-spawn-in-process
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: subagent-fork-in-process
      name: '@deepseek-ai/dsh-subagent-fork-in-process'
      config:
        providerName: fork

    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        # Required by the plugin's schema: it names which provider this tool
        # delegates to. `continuable` is what makes a child resumable.
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: one-shot

    # ---- plan mode ---------------------------------------------------------
    # `section` has no schema default and is required, so the text is restated.
    # Copied verbatim from packages/bundle/base/cordis.patch.yml so plan mode
    # behaves exactly as it does in the shipped `sdk` and `web` profiles.
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

          Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

          The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

          Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

          Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

          When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

    # ---- workflows ---------------------------------------------------------
    - id: ptc-runtime
      name: '@deepseek-ai/dsh-ptc-runtime-node'

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    # ---- context management ------------------------------------------------
    # The minimal profile mounts NO compaction at all, so a long Rigma session
    # hard-stops on context with no relief. Rigma's own native loop compacts;
    # its DSH turns could not. token-meter is what compaction-basic injects.
    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    # ---- web ---------------------------------------------------------------
    # Omitted deliberately: `dsh-web-search-deepseek` needs a live
    # DEEPSEEK_API_KEY, and Rigma's whole premise is a LOCAL model. A web tool
    # that fails on every call is worse than an absent one. Add the three rows
    # below if the key is ever guaranteed:
    #
    #   - id: web
    #     name: '@deepseek-ai/dsh-web'
    #   - id: web-fetch-http
    #     name: '@deepseek-ai/dsh-web-fetch-http'
    #   - id: tool-web
    #     name: '@deepseek-ai/dsh-tool-web'
