# Capabilities Rigma adds to the DeepSeek Harness's minimal profile.
#
# WHY THIS FILE EXISTS. Rigma boots DSH with `profile="sdk-minimal"`. That
# profile is NOT a trimmed `dsh-base` — it is a complete standalone Cordis tree
# (packages/bundle/sdk-minimal/cordis.patch.yml, and its README says so) whose
# only model-facing tools are the two persistent shells. Goals, subagents,
# todos, skills, plan mode, workflows and every filesystem tool were never
# mounted, so no amount of event forwarding could show them: the capabilities
# did not exist in the runtime.
#
# WHY A PATCH AND NOT A PROFILE CHANGE. `profile="sdk"` would add all of this,
# and would also change ~25 unrelated behaviours: the sandbox drops from
# `danger-full-access` to `workspace-write`, an approval gate is mounted that
# has no answerer on the SDK stdio transport and therefore FAILS CLOSED,
# session logs switch to zstd, `$DSH_HOME/settings.yaml` and the credential
# store become live inputs, and the system prompt gains harness identity and
# runtime context. This file adds capabilities without touching any of that.
#
# HOW IT COMPOSES. `applyEntryPatches` (vendor/include/src/index.ts) pushes an
# `insert` list straight onto the profile's entry list with no precondition on
# id or name, and Rigma's `patches=(...)` is applied in `context.overlays` —
# ABOVE every bundle layer. So a pure-insert patch composes on top of the
# standalone minimal tree. Every package named here is a direct dependency of
# the packaged runtime closure (python/sdk-runtime/package.json), so nothing
# needs installing and pnpm is never involved.
#
# READ THIS BEFORE EDITING. A patch row that names an id which does not exist
# is SKIPPED WITH A WARNING, NOT FATALLY — so a typo here silently yields a
# missing tool rather than a failed boot. And `config:` REPLACES a row's whole
# config object; it does not merge. Verify any change with:
#
#   dsh --profile sdk-minimal --patch <this file> --dump-config
#
# and confirm the rows appear. tests/test_dsh_capabilities.py pins the rows
# this file is expected to carry, for the same reason.

- insert:
    # ---- filesystem: provider, then the tools that need it ------------------
    # `dsh-tool-fs` and `dsh-tool-fs-search` inject `fs`, which nothing in the
    # minimal tree provides. Without the provider row the tools mount and then
    # never activate, which looks identical to not having added them.
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'

    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'

    - id: tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        # Required by the plugin's own schema; there is no default, so omitting
        # it is fatal at mount rather than a silent degradation.
        sampleOverCapGlobResults: false

    - id: tool-str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'

    # ---- workspace instructions (AGENTS.md / CLAUDE.md) --------------------
    # The minimal profile discovers none, so a workspace's own instructions are
    # invisible to the agent. 64 KiB matches dsh-base.
    - id: agent-instructions
      name: '@deepseek-ai/dsh-agent-instructions'
      config:
        maxBytes: 65536

    # ---- todos: pure session state, no service behind it -------------------
    - id: tool-todo
      name: '@deepseek-ai/dsh-tool-todo'
      config:
        allowParallelInProgress: true

    # ---- goals: registry, round driver, then the tool ----------------------
    # The driver is what continues a goal across rounds, so `tool-goal` without
    # it would let a model set a goal that nothing ever advances.
    - id: goal
      name: '@deepseek-ai/dsh-goal'

    - id: goal-round-driver
      name: '@deepseek-ai/dsh-goal-round-driver'

    - id: tool-goal
      name: '@deepseek-ai/dsh-tool-goal'

    # ---- skills ------------------------------------------------------------
    - id: skill
      name: '@deepseek-ai/dsh-skill'

    - id: skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'

    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'

    # ---- subagents ---------------------------------------------------------
    # Two providers behind one package: `spawn` starts a fresh child, `fork`
    # continues from the parent's context. Both tools are the same plugin under
    # different toolName configs, which is how dsh-base does it.
    - id: subagent
      name: '@deepseek-ai/dsh-subagent'

    - id: subagent-spawn-in-process
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: subagent-fork-in-process
      name: '@deepseek-ai/dsh-subagent-fork-in-process'
      config:
        providerName: fork

    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        # Required by the plugin's schema: it names which provider this tool
        # delegates to. `continuable` is what makes a child resumable.
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: one-shot

    # ---- plan mode: DELIBERATELY NOT MOUNTED (R5-PLANMODE) ---------------
    # This row used to mount `@deepseek-ai/dsh-plan-mode`, copied verbatim from
    # packages/bundle/base/cordis.patch.yml so plan mode "behaves exactly as it
    # does in the shipped sdk and web profiles". It cannot behave that way here,
    # and the row was worse than useless: it advertised a capability and handed
    # the model a tool that could only ever fail.
    #
    # Plan mode is entered by the `/plan` command and left by the `exit_plan_mode`
    # tool, and those are the ONLY two things the plugin registers
    # (packages/plan/plan-mode/src/index.ts):
    #
    #   :225  ctx.inject(['commands'], (commandCtx) => { commandCtx.commands.register(...)
    #   :273  ctx.tools.register(defineTool({ name: EXIT_PLAN_MODE, ...
    #   :298  const interaction = ctx.get('userQuestions')
    #   :300  throw new Error('no user-questions channel is available to review the
    #                         plan; ask the user to switch the session mode instead')
    #
    # `/plan` exists only inside the `inject(['commands'])` block, so with
    # `dsh-commands` unmounted there is NO way to enter plan mode — the command is
    # not registered. (Checked: `dsh-commands` and `dsh-user-questions` are absent
    # from sdk-minimal AND from this patch; the only `commands` hits in the profile
    # are shell-prompt prose.) And `exit_plan_mode` is registered UNCONDITIONALLY,
    # outside that inject — so mounting this row puts a tool in the catalog whose
    # first act is `throw new Error('exit_plan_mode is only available in plan
    # mode')`, while the only route into plan mode does not exist. The plugin's own
    # section text even ends by telling the model to "ask the user to switch modes
    # manually", which the user cannot do either.
    #
    # So the honest state is: unavailable. Saying that in `harness.py` is worth
    # more than a row that makes the capability list look complete. If the two
    # services are ever mounted, restore this row — the config below is correct and
    # was verified against the upstream text:
    #
    #     - id: plan-mode
    #       name: '@deepseek-ai/dsh-plan-mode'
    #       config:
    #         section: |
    #           You are in plan mode. Stay in plan mode until exit_plan_mode
    #           succeeds or the user switches the session mode. ...
    #
    # `section` is `z.<type>().required()` upstream with no schema default, so it
    # must be restated in full rather than omitted.

    # ---- workflows ---------------------------------------------------------
    - id: ptc-runtime
      name: '@deepseek-ai/dsh-ptc-runtime-node'

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    # ---- context management ------------------------------------------------
    # The minimal profile mounts NO compaction at all, so a long Rigma session
    # hard-stops on context with no relief. Rigma's own native loop compacts;
    # its DSH turns could not. token-meter is what compaction-basic injects.
    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    # ---- web ---------------------------------------------------------------
    # R6-WEBFETCH: `web_fetch` is mounted; `web_search` is NOT, and the split is the
    # whole point of this block.
    #
    # It used to be one decision for two capabilities, justified by an API key. The
    # key belongs to the SEARCH provider only: `dsh-web-search-deepseek` reads
    # DEEPSEEK_API_KEY, while `dsh-web-fetch-http` is an anonymous public fetcher with
    # no credentials to check at all (`web-fetch-http/src/provider.ts:51` — "No
    # credentials to check — an anonymous public fetcher is always usable"). So the
    # old comment named a package that was not even in its own list, and used it to
    # omit a capability it does not constrain. That is a gap wearing the costume of a
    # decision.
    #
    # `search: false` is what makes this a fetch-only mount. Without it,
    # `dsh-tool-web` registers `web_search` too — and with no search provider mounted,
    # that tool would be visible and fail on every call, which is the outcome the
    # original comment was right to want to avoid. `fetch` defaults true and is left
    # alone. `web-fetch-http` is the only registered fetch provider, so it
    # auto-selects (`web/src/index.ts`: "exactly one registered usable provider → that
    # provider"); there is no ambiguity to resolve and no id to pin.
    #
    # NOT mounted, and this is the deliberate half: any search provider. Add one row
    # below AND set `search: true` if a key is ever guaranteed.
    #
    #   - id: web-search-deepseek
    #     name: '@deepseek-ai/dsh-web-search-deepseek'
    - id: web
      name: '@deepseek-ai/dsh-web'

    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'

    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
      config:
        search: false

    # ---- governance: the approval / permission audit trail -----------------
    # O4 (checkpoint 30): the panel that draws `approval/*`, `permission/preset`
    # and `sandbox/mode` was a DEAD FOUR-HOP CHAIN. `sandbox/mode` fires from
    # `sandbox-policy`, which sdk-minimal mounts, so the panel looked live — but
    # the three `approval/*` events come only from `dsh-user-approval` and
    # `permission/preset` only from `dsh-permission-presets`, and NEITHER was
    # mounted anywhere in Rigma's runtime. The audit trail therefore could never
    # fill, and no line anywhere said why. These two rows are that missing hop.
    #
    # `policy: never` is deliberate and is NOT the base bundle's expression. The
    # base computes it from DSH_PERMISSION_MODE, which Rigma never sets, so a
    # verbatim copy would resolve to `ask` here — while sdk-minimal's
    # `sandbox-policy` is hardcoded `danger-full-access`. `ask` on a transport
    # with no approval answerer (the SDK wire has no approval-response method)
    # falls through to the fail-closed `unavailable` and DENIES the call. Rigma
    # runs unconfined, so `never` is the policy that matches the sandbox it
    # actually has: an ask is rejected deterministically without a prompt.
    #
    # HONEST SCOPE — measured by an independent verifier, not assumed. Mounting
    # this row does NOT yet make the trail fill, for two independent reasons:
    #   * The model is NOT told the policy. sdk-minimal sets
    #     `includeRuntimeContext: false` (bundle/sdk-minimal/cordis.patch.yml),
    #     which suppresses EVERY runtime-context contribution — including the
    #     `approval:policy` entry this service registers — so the sentence never
    #     reaches the model. An earlier revision of this comment claimed the
    #     opposite; that claim was false and is corrected here.
    #   * Nothing can ask. sdk-minimal's `sandbox-policy` is hardcoded
    #     `danger-full-access` and only a strictly-wider target escalates, so
    #     `approval/asked` and `approval/decided` stay quiet.
    # The row's observable effect today is creating `ctx.approval` (a different
    # deny *reason* if an ask ever fires). Making the trail real needs
    # `includeRuntimeContext: true` — an owner decision, because it changes the
    # system prompt for every turn — plus a confining shell row. Recorded so the
    # next reader is not misled the way this comment once was.
    #
    # A `!!js` expression is also unusable here — the file is read by Python's
    # `yaml.safe_load` in tests/test_dsh_capabilities.py, which has no `!!js`
    # constructor. (DSH's own JS loader accepts it, and the runtime consumes the
    # patch by PATH, so the restriction is on the Python consumers only.)
    - id: approval
      name: '@deepseek-ai/dsh-user-approval'
      config:
        policy: never

    # `dsh-permission-presets` is what LOGS `permission/preset`, and it also
    # seeds `approval/policy` at session creation (user-approval alone appends
    # no policy event), so it is the half that makes the trail durable rather
    # than merely reachable. It carries a hard dependency the minimal tree does
    # not satisfy: `static inject = ['shell', 'approval', 'sessions',
    # 'sessionProjections']`, and sdk-minimal mounts the PTY `terminal` seam,
    # not a confining `shell` executor. Until a sandboxed shell row is composed
    # (and the packaged runtime closure currently carries `dsh-shell` but
    # neither `dsh-pwsh-sandbox` nor `dsh-bash-sandbox`), this row stays
    # dormant and `permission/preset` stays quiet. That is named here rather
    # than left as a silent gap, which is the whole reason O4 existed.
    #
    # LATENT LANDMINE, named so it is not discovered as a boot failure: if an
    # UNCONFINED `ctx.shell` provider is ever added, this row activates and its
    # constructor THROWS ("the mounted bash executor does not confine"), taking
    # the boot down. A *sandboxed* shell row is the intended way to wake it; a
    # plain one is not.
    #
    # The preset table is restated from the base bundle because `config:`
    # REPLACES the row's whole config, and `danger-full-access` must keep
    # `approval: never` so it matches the `policy` above — otherwise the
    # service's `derive()` finds no preset for the composed defaults and
    # refuses to mount.
    - id: permission
      name: '@deepseek-ai/dsh-permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never
