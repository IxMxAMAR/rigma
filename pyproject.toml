[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rigma"
version = "0.12.0"
description = "Hardware-aware local LLM deployment: probe, resolve, run."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# No `License ::` classifier here on purpose: `license` above is an SPDX
# expression (PEP 639), and declaring both is an error on current build
# backends. PyPI reads the license from that field.
#
# 3.11, 3.12 and 3.13: `requires-python` is what pip enforces, so every
# version it admits must be one CI actually runs (AUDIT 12-12). 3.13 was
# grepped for the APIs removed in 3.13/3.14 (imp, distutils, cgi, telnetlib,
# asyncio.get_event_loop, ...) and uses none, so it joined the matrix rather
# than narrowing the claim. 3.14 is not claimed by a classifier yet.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  # 0.16, not 0.13: the floor ITSELF was the bug, and the `floors` job (AUDIT
  # F61) is what caught it — which is exactly what that job exists for.
  #
  # (1) typer 0.13.0 calls `Parameter.make_metavar()` with no `ctx`
  # (typer/core.py:494, typer/rich_utils.py:367) while declaring only
  # `click>=8.0.0`. click 8.2 made `ctx` a required argument, so EVERY command
  # in the CLI died with `TypeError: Parameter.make_metavar() missing 1 required
  # positional argument: 'ctx'`. 0.16.0 is the first release that dispatches on
  # the installed click's own signature (`inspect.signature(param.make_metavar)`)
  # and therefore works with click<8.2 AND click>=8.2 — measured here against
  # click 8.4.2 and 8.5.0. 0.14.0 and 0.15.0 have the same broken call and the
  # same unbounded `click>=8.0.0`; 0.15.4 caps `click<8.2`, which is a broken
  # environment rather than a fix.
  #
  # (2) The newest `fastapi-cli` — which the `fastapi` floor below pulls in
  # transitively, because fastapi 0.111.0 declares `fastapi-cli>=0.0.2` in its
  # BASE dependencies — already requires `typer>=0.16.0` itself. A floor under
  # that declares a range this project cannot install beside its own fastapi
  # floor, so 0.13 was not merely old, it was unsatisfiable-in-company.
  #
  # (3) The other two failures `floors` reported beside those were NOT a floor
  # problem, and no typer version fixes them: `--engine` and `--refuse` are
  # asserted as substrings of help output, and under `GITHUB_ACTIONS` typer's
  # rich_utils forces a terminal while its OptionHighlighter splits `--refuse`
  # with an ANSI escape between the hyphens. Those two tests now strip ANSI (the
  # `help_text` fixture in tests/conftest.py); raising this floor further would
  # not have moved them.
  "typer>=0.16",
  "httpx>=0.27",
  "psutil>=5.9",
  "huggingface_hub>=0.23",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pillow>=10",
]

[project.optional-dependencies]
nvidia = ["pynvml>=11.5"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
rigma = "rigma.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Selected EXPLICITLY rather than inherited. ruff 0.16.0 widened its default
# rule set and CI (which installs the newest ruff) went from 0 errors to 370
# without a line of this repo changing — 163 of them BLE001 and 55 S110, i.e.
# the deliberate "a tool never raises; errors come back as text the model can
# react to" contract that run_tool is built on. The lint contract is this
# project's to choose, so it is written down here and a future default change
# cannot break the build.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = ["hardware: requires real GPU/network; excluded in CI"]
# `pythonpath` so a FRESH CLONE can run the suite without `pip install -e .`.
# conftest's own guard (tests/conftest.py:70-81) cannot fire in the case it was
# written for — collection runs before session fixtures — so its "run pip
# install -e ." line never printed and the first run was 56 raw ImportErrors
# against whatever rigma was in site-packages. This is the fix it was asking for.
pythonpath = ["src"]
# `-m 'not hardware'` because bare `pytest` is what this repo's own invariant
# test tells you to run (tests/test_repo_invariants.py:22-25) while CI runs the
# marker-excluded set, so the two disagreed — and on a machine with DSH
# installed, bare `pytest` executed REAL agent turns
# (tests/test_harness_dsh_live.py:33-42 records that accident). An explicit
# `-m hardware` on the command line still overrides this, which is how the live
# tests are meant to be asked for.
addopts = "-q -m 'not hardware'"

[tool.hatch.build.targets.wheel]
packages = ["src/rigma"]
