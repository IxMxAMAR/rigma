[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rigma"
version = "0.11.0"
description = "Hardware-aware local LLM deployment: probe, resolve, run."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# No `License ::` classifier here on purpose: `license` above is an SPDX
# expression (PEP 639), and declaring both is an error on current build
# backends. PyPI reads the license from that field.
#
# 3.11, 3.12 and 3.13: `requires-python` is what pip enforces, so every
# version it admits must be one CI actually runs (AUDIT 12-12). 3.13 was
# grepped for the APIs removed in 3.13/3.14 (imp, distutils, cgi, telnetlib,
# asyncio.get_event_loop, ...) and uses none, so it joined the matrix rather
# than narrowing the claim. 3.14 is not claimed by a classifier yet.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  # 0.13, not 0.12: two measured reasons, both found by the `floors` job in CI
  # (AUDIT F61). (1) fastapi 0.111.0 requires fastapi-cli>=0.0.2 in its BASE
  # dependencies — a packaging slip in that release — and every fastapi-cli
  # requires typer>=0.12.3, so `typer>=0.12` was a floor no environment could
  # satisfy. (2) typer 0.12.x raises `Parameter.make_metavar() missing 1
  # required positional argument: 'ctx'` against click>=8.2, so 0.12.5 breaks
  # every command in the CLI on a modern click; 0.13.0 is the first that works.
  "typer>=0.13",
  "httpx>=0.27",
  "psutil>=5.9",
  "huggingface_hub>=0.23",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pillow>=10",
]

[project.optional-dependencies]
nvidia = ["pynvml>=11.5"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
rigma = "rigma.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Selected EXPLICITLY rather than inherited. ruff 0.16.0 widened its default
# rule set and CI (which installs the newest ruff) went from 0 errors to 370
# without a line of this repo changing — 163 of them BLE001 and 55 S110, i.e.
# the deliberate "a tool never raises; errors come back as text the model can
# react to" contract that run_tool is built on. The lint contract is this
# project's to choose, so it is written down here and a future default change
# cannot break the build.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = ["hardware: requires real GPU/network; excluded in CI"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/rigma"]
