[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rigma"
version = "0.10.0"
description = "Hardware-aware local LLM deployment: probe, resolve, run."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# No `License ::` classifier here on purpose: `license` above is an SPDX
# expression (PEP 639), and declaring both is an error on current build
# backends. PyPI reads the license from that field.
#
# 3.11 and 3.12 only, because those are the versions CI actually runs. Listing
# 3.13 would be a claim nothing tests.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "httpx>=0.27",
  "psutil>=5.9",
  "huggingface_hub>=0.23",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pillow>=10",
]

[project.optional-dependencies]
nvidia = ["pynvml>=11.5"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
rigma = "rigma.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Selected EXPLICITLY rather than inherited. ruff 0.16.0 widened its default
# rule set and CI (which installs the newest ruff) went from 0 errors to 370
# without a line of this repo changing — 163 of them BLE001 and 55 S110, i.e.
# the deliberate "a tool never raises; errors come back as text the model can
# react to" contract that run_tool is built on. The lint contract is this
# project's to choose, so it is written down here and a future default change
# cannot break the build.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = ["hardware: requires real GPU/network; excluded in CI"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/rigma"]
