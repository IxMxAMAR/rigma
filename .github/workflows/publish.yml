name: Publish to PyPI

# Publishes rigma to PyPI when a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored anywhere.
# To cut a release: bump `version` in pyproject.toml, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
#   gh release create vX.Y.Z --generate-notes
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # AUDIT 12-6: a GitHub Release can be published from any commit, and
  # `release: published` fires immediately — in parallel with, or before, the
  # `ci` workflow for the tag. Without this job the artifact that reached PyPI
  # was never required to have passed a single test. Verify the tag names the
  # version being released and run the suite before anything is built.
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the release tag must match the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["TAG"]
          assert tag == f"v{version}", f"release tag {tag!r} != v{version}"
          print(f"release tag {tag} matches pyproject version {version}")
          PY
      - run: pip install -e .[dev]
      - run: ruff check src tests
      - run: pytest -m "not hardware"
      # AUDIT 14-1: `release: published` fires WITHOUT waiting for the `ci`
      # workflow, and GitHub's `needs:` cannot cross workflows — so the only
      # freshness check for `src/rigma/data/ui_v2/` lived in a workflow this one
      # never runs, and `tests/test_repo_invariants.py` only greps ci.yml for
      # the string. A Release cut from a commit whose `frontend-v2/src` change
      # was never rebuilt would ship the OLD interface to PyPI, which is the
      # near-miss recorded at `.githooks/pre-commit:8-9`. Rebuild here and
      # refuse a stale bundle: this is the last gate before bytes are uploaded.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - run: npm ci
        working-directory: frontend-v2
      - run: npm run build
        working-directory: frontend-v2
      - name: the committed bundle must match the source
        run: |
          if [ -n "$(git status --porcelain -- src/rigma/data/ui_v2)" ]; then
            echo "::error::src/rigma/data/ui_v2 is stale - run 'npm run build' in frontend-v2/ and commit the result"
            git status --porcelain -- src/rigma/data/ui_v2
            exit 1
          fi

  build:
    name: Build sdist + wheel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # mandatory for OIDC Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        # Pinned to a commit, not a branch. `@release/v1` is a moving ref, and
        # this is the only job that holds `id-token: write` — whoever controls
        # that ref could mint a PyPI token for this project by pushing to it.
        # Bump deliberately: check the action's release notes, then update both
        # the SHA and the comment.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
