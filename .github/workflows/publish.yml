name: Publish to PyPI

# Publishes rigma to PyPI when a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — no API token is stored anywhere.
# To cut a release: bump `version` in pyproject.toml, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
#   gh release create vX.Y.Z --generate-notes
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # mandatory for OIDC Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        # Pinned to a commit, not a branch. `@release/v1` is a moving ref, and
        # this is the only job that holds `id-token: write` — whoever controls
        # that ref could mint a PyPI token for this project by pushing to it.
        # Bump deliberately: check the action's release notes, then update both
        # the SHA and the comment.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
