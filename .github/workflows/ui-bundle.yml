name: UI bundle (Linux)

# Builds the committed UI bundle on Linux and uploads it as an artifact.
#
# WHY THIS EXISTS: `src/rigma/data/ui_v2/` is a committed build artifact, and
# both `ci.yml` (frontend job) and `publish.yml` (verify job) rebuild it and
# refuse if the result differs from what is committed. That guard is right, but
# the Vite build is not byte-reproducible across platforms: on ubuntu/Node 22 CI
# emits `assets/index-xmRK7wGy.js` where every Windows build — Node 25 and Node
# 22.23.3 alike, with `npm ci` lockfile-exact tools — emits
# `assets/index-N2Pzpedq.js`. Ruled out as the cause: the Node version, line
# endings (the built JS is pure LF even though the sources are CRLF), a local
# `.env`, `import.meta.env`, sourcemaps, absolute paths, and the CI environment
# variables (`CI`, `GITHUB_ACTIONS`, `RUNNER_OS`, `GITHUB_SHA`,
# `GITHUB_WORKSPACE`) — all measured, none of them move the hash.
#
# So the only way to produce a bundle that satisfies the check is to build it on
# the platform the check runs on. This workflow is the tool for that; it is not
# part of the normal loop. Delete it once the cross-platform difference is
# understood and the build is reproducible again.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json
      - run: npm ci
        working-directory: frontend-v2
      - run: npm run build
        working-directory: frontend-v2
      - name: show what the build produced
        run: git status --porcelain -- src/rigma/data/ui_v2
      - uses: actions/upload-artifact@v4
        with:
          name: ui_v2
          path: src/rigma/data/ui_v2
          if-no-files-found: error
